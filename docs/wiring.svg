<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 756" width="980" height="756" role="img" aria-label="Wiring diagram: USB-C charges two parallel Li-Po cells through a TP4056; a switch feeds a 5 V boost converter that powers the ESP32-C3 and the buzzer; the OLED runs from the ESP32-C3's 3.3 V pin">
